# SPDX-License-Identifier: Apache-2.0
name: ci

# Once per commit: on push to main, and on pull requests.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: trace reader tests (headless Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run tests/index.html
        run: |
          out=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=3000 --dump-dom "file://$PWD/tests/index.html" 2>/dev/null)
          echo "$out" | sed -n '/<pre/,/<\/pre>/p'
          echo "$out" | grep -q '^<pre id="out">PASS' || { echo "FAIL: the tests did not pass"; exit 1; }

  page:
    name: the page loads an example and draws it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Serve and load examples/hoist_step.csv with its layout
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom \
            "http://127.0.0.1:8765/index.html?a=examples/hoist_step.csv&layout=examples/hoist_step.layout.json" 2>/dev/null)
          echo "$dom" | grep -o 'hoist_step.csv · [0-9]* rows · [0-9]* columns' || { echo "FAIL: the trace did not load"; exit 1; }
          echo "$dom" | grep -q 'class="message error"' && { echo "FAIL: the page shows an error"; exit 1; }
          n=$(echo "$dom" | grep -o '<canvas' | wc -l)
          [ "$n" -ge 5 ] || { echo "FAIL: expected plots, found $n canvases"; exit 1; }
          echo "ok: $n canvases"
      - name: Serve and load the flywheel with a verdict file, one criterion failing and selected
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom \
            "http://127.0.0.1:8766/index.html?a=examples/flywheel.csv&verdicts=examples/flywheel-strict.verdicts.csv&criterion=F1" 2>/dev/null)
          echo "$dom" | grep -o 'flywheel-strict.verdicts.csv · 3 criteria · 1 FAIL' || { echo "FAIL: the verdicts did not load"; exit 1; }
          echo "$dom" | grep -q 'class="message error"' && { echo "FAIL: the page shows an error"; exit 1; }
          [ "$(echo "$dom" | grep -o 'class="crit pass"' | wc -l)" -eq 2 ] || { echo "FAIL: expected 2 passing criteria"; exit 1; }
          echo "$dom" | grep -q '<li class="crit fail"><button type="button" aria-pressed="true"' || { echo "FAIL: F1 is not listed as failed and selected"; exit 1; }
          n=$(echo "$dom" | grep -o '<canvas' | wc -l)
          [ "$n" -ge 5 ] || { echo "FAIL: expected the criteria strip and plots, found $n canvases"; exit 1; }
          echo "ok: 3 criteria, F1 failed and selected, $n canvases"
      - name: Serve and load a corrupted TSC1 on the bus, decoded with open-crank.dbc
        run: |
          python3 -m http.server 8767 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom \
            "http://127.0.0.1:8767/index.html?a=examples/speed_command_corrupt.csv&layout=examples/hoist_step.layout.json&verdicts=examples/speed_command_corrupt.verdicts.csv&frames=examples/speed_command_corrupt.frames.csv&dbc=examples/open-crank.dbc&frame=2837" 2>/dev/null)
          echo "$dom" | grep -o 'speed_command_corrupt.frames.csv · 8849 frames · bus_clock=sim' || { echo "FAIL: the frame log did not load"; exit 1; }
          echo "$dom" | grep -o 'open-crank.dbc · 12 messages · J1939' || { echo "FAIL: the DBC did not load"; exit 1; }
          echo "$dom" | grep -q 'class="message error"' && { echo "FAIL: the page shows an error"; exit 1; }
          echo "$dom" | grep -q '<h4>Frame (line 2837 of speed_command_corrupt.frames.csv)</h4>' || { echo "FAIL: frame 2837 is not selected"; exit 1; }
          echo "$dom" | grep -q '<td>checksum (SPN 4207)</td><td>0, wrong: J1939-71 gives 14</td>' || { echo "FAIL: the corrupted TSC1's checksum is not flagged"; exit 1; }
          echo "$dom" | grep -q '<td>RequestedTorque</td><td>(130 %)</td><td>0xFF</td><td>not available (J1939: all ones)</td>' || { echo "FAIL: 0xFF is not read as not available"; exit 1; }
          n=$(echo "$dom" | grep -o '<canvas' | wc -l)
          [ "$n" -ge 6 ] || { echo "FAIL: expected the criteria strip, the bus and plots, found $n canvases"; exit 1; }
          echo "ok: frame 2837 decoded, checksum flagged, $n canvases"
      - name: Serve and load a frame log alone (no trace, no dictionary)
        run: |
          python3 -m http.server 8768 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 1
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom \
            "http://127.0.0.1:8768/index.html?frames=examples/hoist_step.frames.csv" 2>/dev/null)
          echo "$dom" | grep -o 'hoist_step.frames.csv · 8849 frames · bus_clock=sim' || { echo "FAIL: the frame log did not load"; exit 1; }
          echo "$dom" | grep -q 'class="message error"' && { echo "FAIL: the page shows an error"; exit 1; }
          echo "$dom" | grep -q 'aria-label="Bus: 8849 frames in' || { echo "FAIL: no bus panel"; exit 1; }
          echo "ok: the bus alone"
